<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoExposure Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f6f8f7;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --border: #d7ded9;
      --accent: #0f766e;
      --accent-dark: #115e59;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 22px 16px;
      background: linear-gradient(135deg, #0f766e, #164e63);
      color: white;
    }

    header h1 { margin: 0 0 6px; font-size: 1.45rem; }
    header p { margin: 0; font-size: 0.95rem; opacity: 0.9; }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }

    h2 { margin: 0 0 14px; font-size: 1.05rem; }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin: 12px 0 5px;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: white;
    }

    button, a.button {
      display: inline-block;
      text-align: center;
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: white;
      text-decoration: none;
      width: 100%;
      margin-top: 10px;
    }

    button:hover, a.button:hover { background: var(--accent-dark); }

    .secondary {
      background: #e5e7eb;
      color: #1f2933;
    }

    .status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .top-nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .top-nav a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
  
.password-field{position:relative}.password-field input{padding-right:56px}.password-field .password-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;margin:0;padding:10px;display:flex;align-items:center;justify-content:center;background:transparent;color:#0f766e;border:0;border-radius:8px;cursor:pointer}.password-field .password-eye:hover{background:#eef7f5}.password-field .password-eye:focus-visible{outline:3px solid #0f766e;outline-offset:1px}.password-eye [hidden]{display:none}.password-eye svg{width:24px;height:24px;pointer-events:none}
</style>
</head>

<body>
  <header>
    <h1>EcoExposure Reset Password</h1>
    <p>Set a new password for your EcoExposure account</p>
  </header>

  <main>
    <div class="top-nav">
      <a href="./index.html">← Back to Capture App</a>
    </div>

    <section>
      <h2>New Password</h2>

      <label for="newPassword">Enter new password</label>
      <div class="password-field"><input id="newPassword" type="password" placeholder="New password" autocomplete="new-password" /><button class="password-eye" type="button" aria-controls="newPassword" aria-label="Show new password" title="Show new password" aria-pressed="false" data-password-label="new password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><path data-eye-slash d="M3 3l18 18" hidden/></svg></button></div>

      <label for="confirmPassword">Confirm new password</label>
      <div class="password-field"><input id="confirmPassword" type="password" placeholder="Confirm new password" autocomplete="new-password" /><button class="password-eye" type="button" aria-controls="confirmPassword" aria-label="Show confirmation password" title="Show confirmation password" aria-pressed="false" data-password-label="confirmation password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><path data-eye-slash d="M3 3l18 18" hidden/></svg></button></div>

      <button type="button" onclick="updatePassword()">Update Password</button>

      <div class="status" id="status">Enter your new password after opening the reset link from your email.</div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://qvmgrchkmmezpwhlfxjv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_3M-2qrVCnjO9XfjsBCUf6g_l1wSuwVu";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    window.onerror = function(message, source, lineno) {
      document.getElementById("status").textContent =
        "JavaScript error: " + message + " at line " + lineno;
    };

    async function updatePassword() {
      const password = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmPassword").value;
      const status = document.getElementById("status");

      if (!password || !confirm) {
        status.textContent = "Enter and confirm your new password.";
        return;
      }

      if (password !== confirm) {
        status.textContent = "Passwords do not match.";
        return;
      }

      if (password.length < 8) {
        status.textContent = "Password should be at least 8 characters.";
        return;
      }

      status.textContent = "Updating password...";

      const { error } = await supabaseClient.auth.updateUser({
        password: password
      });

      if (error) {
        status.textContent = "Password update failed: " + error.message;
        return;
      }

      status.textContent = "Password updated successfully. You can now log in.";
    }
  </script>

<script>
(function(){
 document.querySelectorAll('.password-eye').forEach(function(button){
  button.addEventListener('click',function(){
   var input=document.getElementById(button.getAttribute('aria-controls'));
   var visible=input.type==='password';
   input.type=visible?'text':'password';
   button.setAttribute('aria-pressed',String(visible));
   button.setAttribute('aria-label',(visible?'Hide ':'Show ')+button.dataset.passwordLabel);
   button.title=(visible?'Hide ':'Show ')+button.dataset.passwordLabel;
   button.querySelector('[data-eye-slash]').toggleAttribute('hidden',!visible);
  });
 });
 function conceal(){document.querySelectorAll('.password-eye[aria-pressed="true"]').forEach(function(b){b.click();});}
 window.addEventListener('pagehide',conceal);
 document.addEventListener('visibilitychange',function(){if(document.hidden)conceal();});
})();
</script>
</body>
</html>
